<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="José Jaraba — Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".45"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="frame"><rect width="1000" height="240" rx="18"/></clipPath>
    <style>
      text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
      .name { font-size: 46px; font-weight: 800; fill: #f5f7ff; }
      .role { font-size: 20px; font-weight: 600; fill: url(#accent); }
      .meta { font-size: 15px; fill: #9aa4bf; }
      .code { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 13px; fill: #9aa4bf; }
      .kw { fill: #c4b5fd; } .str { fill: #67e8f9; }
      .floatA { animation: floatA 9s ease-in-out infinite; }
      .floatB { animation: floatB 11s ease-in-out infinite; }
      @keyframes floatA { 50% { transform: translate(40px, 20px); } }
      @keyframes floatB { 50% { transform: translate(-50px, -15px); } }
      .in { animation: in .8s ease both; }
      @keyframes in { from { opacity: .2; } to { opacity: 1; } }
      .caret { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .node { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .35; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="240" fill="url(#bg)"/>
    <rect width="1000" height="240" fill="url(#grid)"/>
    <circle class="floatA" cx="760" cy="40" r="180" fill="url(#glowA)"/>
    <circle class="floatB" cx="930" cy="220" r="160" fill="url(#glowB)"/>

    <!-- red neuronal decorativa -->
    <g stroke="#8b5cf6" stroke-opacity=".35" stroke-width="1.2">
      <line x1="720" y1="70" x2="800" y2="50"/><line x1="720" y1="70" x2="800" y2="120"/><line x1="720" y1="70" x2="800" y2="190"/>
      <line x1="720" y1="150" x2="800" y2="50"/><line x1="720" y1="150" x2="800" y2="120"/><line x1="720" y1="150" x2="800" y2="190"/>
      <line x1="800" y1="50" x2="880" y2="90"/><line x1="800" y1="120" x2="880" y2="90"/><line x1="800" y1="190" x2="880" y2="90"/>
      <line x1="800" y1="50" x2="880" y2="160"/><line x1="800" y1="120" x2="880" y2="160"/><line x1="800" y1="190" x2="880" y2="160"/>
    </g>
    <g fill="#22d3ee">
      <circle class="node" cx="720" cy="70" r="6"/><circle class="node" style="animation-delay:.5s" cx="720" cy="150" r="6"/>
      <circle class="node" style="animation-delay:1s" cx="800" cy="50" r="6"/><circle class="node" style="animation-delay:1.5s" cx="800" cy="120" r="6"/>
      <circle class="node" style="animation-delay:2s" cx="800" cy="190" r="6"/>
      <circle class="node" style="animation-delay:.8s" cx="880" cy="90" r="6" fill="#8b5cf6"/><circle class="node" style="animation-delay:1.8s" cx="880" cy="160" r="6" fill="#8b5cf6"/>
    </g>

    <g class="in"><text x="56" y="92" class="name">Hola, soy José Jaraba 👋</text></g>
    <g class="in" style="animation-delay:.25s"><text x="58" y="128" class="role">Software Engineer · AI · Backend · Mobile</text></g>
    <g class="in" style="animation-delay:.45s"><text x="58" y="160" class="meta">📍 Medellín, Colombia  ·  🏢 BigMountain Solutions</text></g>
    <g class="in" style="animation-delay:.7s">
      <text x="58" y="200" class="code"><tspan class="kw">const</tspan> focus = [<tspan class="str">"AI systems"</tspan>, <tspan class="str">"APIs"</tspan>, <tspan class="str">"Flutter"</tspan>, <tspan class="str">"Web"</tspan>];<tspan class="caret" fill="#22d3ee"> ▍</tspan></text>
    </g>
    <rect x="0" y="236" width="1000" height="4" fill="url(#accent)"/>
  </g>
</svg>
