    <rect x="834.9" y="56" width="1.1" height="12" fill="#f1e05a"/>
  </g>
  <g class="fade" style="animation-delay:0.0s"><circle cx="30" cy="94" r="6" fill="#4F5D95"/><text x="44" y="98" class="small">PHP</text><text x="74" y="98" class="label">41.0%</text></g>
